<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>無駄にド派手な電卓</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --bg0: #050014;
    --bg1: #0d0230;
    --magenta: #ff2e97;
    --cyan: #00f0ff;
    --gold: #ffd34d;
    --violet: #7c4dff;
    --green: #39ff88;
    --panel: rgba(8, 3, 34, 0.93);
    --disp-font: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
    --head-font: "Arial Black", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--bg0);
    overflow: hidden;
    font-family: var(--head-font);
    color: #fff;
    user-select: none;
    -webkit-user-select: none;
  }
  canvas.layer {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
  }
  #bg { z-index: 0; }
  #fx { z-index: 30; pointer-events: none; }

  #stage {
    position: relative;
    z-index: 10;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: clamp(8px, 2vh, 20px);
    padding: 12px;
  }

  /* ---------- header ---------- */
  #title {
    font-size: clamp(20px, 4.5vw, 44px);
    font-weight: 900;
    letter-spacing: 0.06em;
    text-align: center;
    background: linear-gradient(90deg,
      var(--magenta), var(--gold), var(--cyan), var(--violet), var(--magenta));
    background-size: 300% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: titleflow 8s linear infinite;
    filter: drop-shadow(0 0 14px rgba(255, 46, 151, 0.55));
    text-wrap: balance;
  }
  #title small {
    display: block;
    font-size: 0.34em;
    letter-spacing: 0.5em;
    opacity: 0.9;
  }
  @keyframes titleflow { to { background-position: 300% 0; } }

  #combo {
    min-height: 1.4em;
    font-size: clamp(14px, 2.4vw, 22px);
    font-weight: 900;
    letter-spacing: 0.12em;
    color: var(--gold);
    text-shadow: 0 0 12px var(--gold), 0 0 30px var(--magenta);
    opacity: 0;
    transform: scale(0.6);
    transition: opacity 0.15s, transform 0.15s;
  }
  #combo.on { opacity: 1; transform: scale(1); }
  #combo.mega { color: var(--cyan); animation: comboPulse 0.35s infinite alternate; }
  @keyframes comboPulse {
    from { transform: scale(1) rotate(-1.5deg); }
    to   { transform: scale(1.18) rotate(1.5deg); }
  }

  /* ---------- cabinet ---------- */
  #cab {
    position: relative;
    width: min(92vw, 400px);
    border-radius: 22px;
    padding: 3px;
    overflow: hidden;
    box-shadow:
      0 0 24px rgba(255, 46, 151, 0.45),
      0 0 70px rgba(0, 240, 255, 0.25),
      0 24px 60px rgba(0, 0, 0, 0.7);
  }
  #cab::before {
    content: "";
    position: absolute;
    inset: -100%;
    background: conic-gradient(
      var(--magenta), var(--violet), var(--cyan),
      var(--gold), var(--magenta));
    animation: rimspin 6s linear infinite;
    will-change: transform;
  }
  @keyframes rimspin { to { transform: rotate(360deg); } }
  #cab.charging { transform: scale(0.95); filter: brightness(1.6) saturate(1.6); transition: transform 0.5s ease-in, filter 0.5s ease-in; }
  #cab-inner {
    position: relative;
    border-radius: 19px;
    background: var(--panel);
    padding: clamp(12px, 3vw, 20px);
    overflow: hidden;
  }
  #cab-inner::after {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: repeating-linear-gradient(
      0deg, rgba(255,255,255,0.035) 0 1px, transparent 1px 3px);
  }

  /* ---------- display ---------- */
  #display {
    position: relative;
    border-radius: 12px;
    background: linear-gradient(180deg, #02000d, #0a0524);
    border: 1px solid rgba(0, 240, 255, 0.35);
    box-shadow: inset 0 0 26px rgba(0, 240, 255, 0.16);
    padding: 14px 16px 10px;
    margin-bottom: clamp(10px, 2.5vw, 16px);
    min-height: 92px;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    overflow: hidden;
  }
  #expr {
    font-family: var(--disp-font);
    font-size: clamp(12px, 3vw, 15px);
    color: rgba(0, 240, 255, 0.75);
    text-align: right;
    min-height: 1.3em;
    letter-spacing: 0.08em;
    white-space: nowrap;
  }
  #expr.charge {
    color: var(--gold);
    text-shadow: 0 0 10px var(--gold);
    animation: chargeblink 0.12s infinite;
  }
  @keyframes chargeblink { 50% { opacity: 0.3; } }
  #out {
    font-family: var(--disp-font);
    font-variant-numeric: tabular-nums;
    font-weight: 700;
    font-size: clamp(34px, 9vw, 52px);
    line-height: 1.1;
    text-align: right;
    color: #eafffd;
    text-shadow: 0 0 10px var(--cyan), 0 0 34px rgba(0, 240, 255, 0.6);
    white-space: nowrap;
  }
  #out.slam { animation: slam 0.45s cubic-bezier(0.2, 2.4, 0.4, 1); }
  @keyframes slam {
    0%   { transform: scale(2.4); opacity: 0; }
    60%  { transform: scale(0.92); opacity: 1; }
    100% { transform: scale(1); }
  }
  #out.err {
    color: #ff5c7a;
    text-shadow: 0 0 12px #ff2e4d, 0 0 40px #ff2e4d;
    animation: glitch 0.12s infinite;
  }
  @keyframes glitch {
    0%   { transform: translate(0, 0) skewX(0); }
    25%  { transform: translate(-4px, 2px) skewX(-6deg); }
    50%  { transform: translate(3px, -2px) skewX(4deg); }
    75%  { transform: translate(-2px, 1px) skewX(-2deg); }
    100% { transform: translate(0, 0) skewX(0); }
  }

  /* ---------- keys ---------- */
  #keys {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: clamp(7px, 1.8vw, 11px);
  }
  button.key {
    font-family: var(--head-font);
    font-weight: 900;
    font-size: clamp(18px, 4.8vw, 24px);
    padding: clamp(12px, 3vw, 17px) 0;
    border-radius: 12px;
    border: 1px solid rgba(124, 77, 255, 0.5);
    background: linear-gradient(180deg, #1a0f45, #100833);
    color: #d9d4ff;
    cursor: pointer;
    position: relative;
    transition: transform 0.06s, filter 0.12s;
    box-shadow: 0 4px 0 #08031f;
    touch-action: manipulation;
  }
  button.key:hover { filter: brightness(1.35); }
  button.key:active, button.key.pressed { transform: translateY(4px) scale(0.96); }
  button.key:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }

  button.key.op {
    border-color: rgba(0, 240, 255, 0.6);
    background: linear-gradient(180deg, #003a4d, #00222e);
    color: var(--cyan);
    text-shadow: 0 0 8px var(--cyan);
  }
  button.key.util {
    border-color: rgba(255, 211, 77, 0.55);
    background: linear-gradient(180deg, #4d3400, #2e1f00);
    color: var(--gold);
    text-shadow: 0 0 8px var(--gold);
  }
  button.key.eq {
    grid-row: span 2;
    border-color: var(--magenta);
    background: linear-gradient(180deg, #ff2e97, #b3005e);
    color: #fff;
    text-shadow: 0 0 10px #fff;
    font-size: clamp(24px, 6vw, 32px);
    box-shadow: 0 4px 0 #5c0030, 0 0 18px rgba(255, 46, 151, 0.75);
  }
  button.key.eq::after {
    content: "";
    position: absolute;
    inset: -5px;
    border-radius: 16px;
    box-shadow: 0 0 26px rgba(255, 46, 151, 0.95);
    opacity: 0.25;
    animation: eqglow 1.6s ease-in-out infinite;
    pointer-events: none;
    will-change: opacity;
  }
  @keyframes eqglow { 50% { opacity: 1; } }
  button.key.zero { grid-column: span 2; }

  /* ---------- footer ---------- */
  #foot {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: 8px 10px;
    font-size: 12px;
    letter-spacing: 0.2em;
    color: rgba(217, 212, 255, 0.55);
    max-width: 92vw;
  }
  .chip {
    font-family: var(--head-font);
    font-weight: 900;
    font-size: 11px;
    letter-spacing: 0.12em;
    padding: 6px 12px;
    border-radius: 999px;
    border: 1px solid rgba(255, 255, 255, 0.22);
    background: transparent;
    color: rgba(255, 255, 255, 0.45);
    cursor: pointer;
  }
  .chip:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
  .chip.active {
    border-color: var(--cyan);
    background: rgba(0, 240, 255, 0.1);
    color: var(--cyan);
    text-shadow: 0 0 8px var(--cyan);
  }
  .chip.live {
    border-color: var(--gold);
    color: var(--gold);
    background: rgba(255, 211, 77, 0.08);
  }
  #snd.chip { border-color: rgba(0, 240, 255, 0.5); color: var(--cyan); background: rgba(0, 240, 255, 0.08); }
  #snd.chip.off { border-color: rgba(255,255,255,0.25); color: rgba(255,255,255,0.4); background: transparent; }
  #fxsel { display: flex; gap: 6px; align-items: center; }
  #fxsel .lbl { font-size: 10px; letter-spacing: 0.2em; color: rgba(217,212,255,0.45); }

  /* ---------- overlays ---------- */
  #flash {
    position: fixed;
    inset: 0;
    z-index: 60;
    pointer-events: none;
    background: #fff;
    opacity: 0;
  }
  #dim {
    position: fixed;
    inset: 0;
    z-index: 35;
    pointer-events: none;
    background: radial-gradient(circle at 50% 55%, transparent 18%, rgba(0, 0, 12, 0.88) 75%);
    opacity: 0;
    transition: opacity 0.4s;
    will-change: opacity;
  }
  #dim.on { opacity: 1; }

  /* ---------- pooled DOM effects (transform/opacity only = compositor)
     these are the LITE tier's whole particle system, and free extra
     juice on higher tiers ---------- */
  #fxdom {
    position: fixed;
    inset: 0;
    z-index: 32;
    pointer-events: none;
    overflow: hidden;
  }
  #fxdom > div {
    position: absolute;
    opacity: 0;
    will-change: transform, opacity;
  }
  .pop {
    border-radius: 50%;
    background: radial-gradient(closest-side,
      rgba(255, 255, 255, 0.95), var(--c, #ff2e97) 30%, transparent 72%);
  }
  .pop.go { animation: popfx 0.5s ease-out; }
  @keyframes popfx {
    0%   { transform: scale(0.15); opacity: 1; }
    100% { transform: scale(1); opacity: 0; }
  }
  .ring {
    border-radius: 50%;
    border: 3px solid var(--c, #00f0ff);
    box-shadow: 0 0 14px var(--c, #00f0ff), inset 0 0 10px var(--c, #00f0ff);
  }
  .ring.go { animation: ringfx 0.55s ease-out; }
  @keyframes ringfx {
    0%   { transform: scale(0.12); opacity: 1; }
    100% { transform: scale(1); opacity: 0; }
  }
  .ringin.go { animation: ringinfx 0.5s ease-in; }
  .ringin {
    border-radius: 50%;
    border: 3px solid var(--c, #ffd34d);
    box-shadow: 0 0 14px var(--c, #ffd34d);
  }
  @keyframes ringinfx {
    0%   { transform: scale(1.6); opacity: 0; }
    25%  { opacity: 1; }
    100% { transform: scale(0.08); opacity: 0.9; }
  }
  .rays {
    background: repeating-conic-gradient(from 0deg,
      var(--c, #ffd34d) 0deg 5deg, transparent 5deg 26deg);
    -webkit-mask: radial-gradient(closest-side, #000 20%, transparent 72%);
    mask: radial-gradient(closest-side, #000 20%, transparent 72%);
    border-radius: 50%;
  }
  .rays.go { animation: raysfx 0.6s ease-out; }
  @keyframes raysfx {
    0%   { transform: scale(0.2) rotate(0deg); opacity: 1; }
    100% { transform: scale(1.1) rotate(45deg); opacity: 0; }
  }

  /* giant exploding result */
  #boom {
    position: fixed;
    inset: 0;
    z-index: 50;
    pointer-events: none;
    display: flex;
    align-items: center;
    justify-content: center;
    visibility: hidden;
  }
  #boom.show { visibility: visible; }
  #boom .num {
    font-family: var(--disp-font);
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    font-size: clamp(56px, 17vw, 200px);
    display: flex;
    white-space: nowrap;
    will-change: transform, opacity;
  }
  #boom .ch {
    display: inline-block;
    color: #fff;
    text-shadow:
      0 0 22px var(--magenta),
      -4px 0 0 rgba(255, 0, 80, 0.85),
      4px 0 0 rgba(0, 220, 255, 0.85);
    animation: chpop 0.55s cubic-bezier(0.2, 2.7, 0.3, 1) both;
    will-change: transform, opacity;
  }
  @keyframes chpop {
    0% {
      transform: scale(5) rotate(var(--rot, 0deg)) translateY(-50px);
      opacity: 0;
    }
    55% {
      transform: scale(0.88) rotate(0deg);
      opacity: 1;
    }
    100% { transform: scale(1); }
  }
  #boom.fly .num {
    animation: boomfly 0.42s cubic-bezier(0.55, -0.15, 0.8, 0.7) both;
  }
  @keyframes boomfly {
    to {
      transform: translate(var(--tx, 0px), var(--ty, 0px)) scale(0.1);
      opacity: 0;
    }
  }

  /* diagonal cut-in banner */
  #cutin {
    position: fixed;
    top: 30%;
    left: -4%;
    width: 108%;
    z-index: 48;
    pointer-events: none;
    padding: clamp(8px, 1.6vw, 16px) 0;
    text-align: center;
    background: linear-gradient(90deg,
      transparent 0%, rgba(255, 46, 151, 0.92) 18%,
      rgba(124, 77, 255, 0.92) 82%, transparent 100%);
    border-top: 2px solid rgba(255, 255, 255, 0.7);
    border-bottom: 2px solid rgba(255, 255, 255, 0.7);
    transform: rotate(-5deg) translateX(-130vw);
    visibility: hidden;
    will-change: transform;
  }
  #cutin.red {
    background: linear-gradient(90deg,
      transparent 0%, rgba(255, 30, 60, 0.94) 18%,
      rgba(120, 0, 20, 0.94) 82%, transparent 100%);
  }
  #cutin span {
    font-family: var(--head-font);
    font-style: italic;
    font-weight: 900;
    font-size: clamp(26px, 6.5vw, 62px);
    letter-spacing: 0.18em;
    color: #fff;
    text-shadow: 0 0 18px rgba(255, 255, 255, 0.9), 4px 4px 0 rgba(0, 0, 0, 0.45);
  }
  #cutin.go {
    visibility: visible;
    animation: cutslide 1.15s cubic-bezier(0.16, 0.9, 0.3, 1) both;
  }
  @keyframes cutslide {
    0%   { transform: rotate(-5deg) translateX(-130vw); }
    32%  { transform: rotate(-5deg) translateX(0); }
    68%  { transform: rotate(-5deg) translateX(0); }
    100% { transform: rotate(-5deg) translateX(130vw); }
  }

  body.alarm #cab { animation: alarmshake 0.08s infinite; }
  @keyframes alarmshake {
    0% { transform: translate(-5px, 3px); }
    50% { transform: translate(5px, -3px); }
    100% { transform: translate(-3px, -2px); }
  }

  @media (prefers-reduced-motion: reduce) {
    #title, #cab::before, button.key.eq::after, #combo.mega,
    body.alarm #cab, #out.err, #expr.charge,
    .pop.go, .ring.go, .ringin.go, .rays.go { animation: none !important; }
    #out.slam { animation: none; }
    button.key, #out, #dim, #cab.charging { transition: none; }
  }
</style>

</head>
<body>
<canvas id="bg" class="layer"></canvas>

<div id="stage">
  <h1 id="title">無駄にド派手な電卓<small>ULTIMATE FLASHY CALCULATOR</small></h1>
  <div id="combo" aria-hidden="true"></div>

  <div id="cab">
    <div id="cab-inner">
      <div id="display">
        <div id="expr" aria-hidden="true"></div>
        <output id="out" aria-live="polite">0</output>
      </div>
      <div id="keys">
        <button class="key util" data-k="C">C</button>
        <button class="key util" data-k="bs">⌫</button>
        <button class="key util" data-k="%">%</button>
        <button class="key op" data-k="/">÷</button>
        <button class="key" data-k="7">7</button>
        <button class="key" data-k="8">8</button>
        <button class="key" data-k="9">9</button>
        <button class="key op" data-k="*">×</button>
        <button class="key" data-k="4">4</button>
        <button class="key" data-k="5">5</button>
        <button class="key" data-k="6">6</button>
        <button class="key op" data-k="-">−</button>
        <button class="key" data-k="1">1</button>
        <button class="key" data-k="2">2</button>
        <button class="key" data-k="3">3</button>
        <button class="key op" data-k="+">+</button>
        <button class="key zero" data-k="0">0</button>
        <button class="key" data-k=".">.</button>
        <button class="key eq" data-k="=">=</button>
      </div>
    </div>
  </div>

  <div id="foot">
    <button id="snd" class="chip" aria-pressed="true">SOUND ON</button>
    <div id="fxsel" role="group" aria-label="演出の派手さ">
      <span class="lbl">FX</span>
      <button class="chip" data-mode="auto">AUTO</button>
      <button class="chip" data-mode="0">ULTRA</button>
      <button class="chip" data-mode="1">HIGH</button>
      <button class="chip" data-mode="2">LITE</button>
    </div>
  </div>
</div>

<div id="dim"></div>
<div id="fxdom"></div>
<canvas id="fx" class="layer"></canvas>
<div id="cutin"><span>ANSWER!!!</span></div>
<div id="boom"><div class="num"></div></div>
<div id="flash"></div>

<script>
(() => {
  "use strict";
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* ================= effect tiers =================
     0 ULTRA — full canvas particle system, DPR up to 2, everything on
     1 HIGH  — trimmed canvas particles, DPR 1.5
     2 LITE  — canvas particles almost off; flash comes from pooled DOM
               elements animated with transform/opacity only, which the
               compositor handles off the main thread */
  const MODES = [
    { name: "ULTRA", mul: 1.3, cap: 520, dprCap: 2,   trails: true,  gridH: 16, gridV: 12, orbs: 30, bolts: 8, fw: 10, css: false },
    { name: "HIGH",  mul: 0.7, cap: 260, dprCap: 1.5, trails: true,  gridH: 11, gridV: 7,  orbs: 20, bolts: 4, fw: 5,  css: false },
    { name: "LITE",  mul: 0.12, cap: 50, dprCap: 1,   trails: false, gridH: 7,  gridV: 4,  orbs: 10, bolts: 1, fw: 4,  css: true }
  ];
  let mode = 1, autoMode = true;
  const M = () => MODES[mode];
  function q(n) { return Math.max(2, Math.round(n * M().mul)); }

  function store(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function load(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }

  function detectMode() {
    const mem = navigator.deviceMemory || 0;
    const cores = navigator.hardwareConcurrency || 0;
    if (mem >= 8 || cores >= 10) return 0;
    if ((mem && mem < 4) || (cores && cores <= 4)) return 2;
    return 1;
  }

  const chips = [...document.querySelectorAll("#fxsel .chip")];
  function updateChips() {
    for (const c of chips) {
      const v = c.dataset.mode;
      c.classList.toggle("active", autoMode ? v === "auto" : v === String(mode));
      // in AUTO, also show which tier is currently live
      c.classList.toggle("live", autoMode && v === String(mode));
    }
  }
  function applyMode(m) {
    mode = Math.max(0, Math.min(2, m));
    updateChips();
    resize();
  }
  for (const c of chips) {
    c.addEventListener("click", () => {
      const v = c.dataset.mode;
      if (v === "auto") { autoMode = true; applyMode(detectMode()); }
      else { autoMode = false; applyMode(Number(v)); }
      store("fxmode", v);
      beep(880, 0.08);
    });
  }

  /* ================= audio ================= */
  let actx = null, soundOn = true;
  const sndBtn = document.getElementById("snd");
  function audio() {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === "suspended") actx.resume();
    return actx;
  }
  function beep(freq, dur = 0.08, type = "square", vol = 0.12, when = 0) {
    if (!soundOn) return;
    try {
      const a = audio(), t = a.currentTime + when;
      const o = a.createOscillator(), g = a.createGain();
      o.type = type; o.frequency.setValueAtTime(freq, t);
      g.gain.setValueAtTime(vol, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g).connect(a.destination);
      o.start(t); o.stop(t + dur + 0.02);
    } catch (e) {}
  }
  function chord(delay = 0) {
    [523.25, 659.25, 783.99, 1046.5, 1318.5].forEach((f, i) =>
      beep(f, 0.55, "sawtooth", 0.08, delay + i * 0.05));
  }
  function riserSnd() {
    if (!soundOn) return;
    try {
      const a = audio(), t = a.currentTime;
      const o = a.createOscillator(), g = a.createGain();
      o.type = "sawtooth";
      o.frequency.setValueAtTime(80, t);
      o.frequency.exponentialRampToValueAtTime(1200, t + 0.55);
      g.gain.setValueAtTime(0.001, t);
      g.gain.exponentialRampToValueAtTime(0.2, t + 0.5);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.62);
      o.connect(g).connect(a.destination);
      o.start(t); o.stop(t + 0.65);
    } catch (e) {}
  }
  function boomSnd() {
    if (!soundOn) return;
    try {
      const a = audio(), t = a.currentTime;
      const len = Math.floor(a.sampleRate * 1.1);
      const buf = a.createBuffer(1, len, a.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.4);
      const src = a.createBufferSource(); src.buffer = buf;
      const f = a.createBiquadFilter(); f.type = "lowpass";
      f.frequency.setValueAtTime(9000, t);
      f.frequency.exponentialRampToValueAtTime(110, t + 1);
      const g = a.createGain();
      g.gain.setValueAtTime(0.55, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + 1.05);
      src.connect(f).connect(g).connect(a.destination);
      src.start(t);
      const o = a.createOscillator(); o.type = "sine";
      o.frequency.setValueAtTime(150, t);
      o.frequency.exponentialRampToValueAtTime(32, t + 0.7);
      const g2 = a.createGain();
      g2.gain.setValueAtTime(0.5, t);
      g2.gain.exponentialRampToValueAtTime(0.001, t + 0.8);
      o.connect(g2).connect(a.destination);
      o.start(t); o.stop(t + 0.85);
    } catch (e) {}
  }
  function alarmSnd() {
    for (let i = 0; i < 6; i++) beep(180 + (i % 2) * 120, 0.14, "sawtooth", 0.14, i * 0.13);
  }
  function zapSnd() {
    if (!soundOn) return;
    try {
      const a = audio(), t = a.currentTime;
      const o = a.createOscillator(), g = a.createGain();
      o.type = "square";
      o.frequency.setValueAtTime(2400, t);
      o.frequency.exponentialRampToValueAtTime(180, t + 0.12);
      g.gain.setValueAtTime(0.09, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.13);
      o.connect(g).connect(a.destination);
      o.start(t); o.stop(t + 0.15);
    } catch (e) {}
  }
  sndBtn.addEventListener("click", () => {
    soundOn = !soundOn;
    sndBtn.textContent = soundOn ? "SOUND ON" : "SOUND OFF";

  });

  /* ================= canvases ================= */
  const bg = document.getElementById("bg"), bctx = bg.getContext("2d");
  const fx = document.getElementById("fx"), fctx = fx.getContext("2d");
  let W = 0, H = 0;
  let bgGrad = null, bgGradHyper = null;
  function resize() {
    const dpr = Math.min(devicePixelRatio || 1, M().dprCap);
    W = innerWidth; H = innerHeight;
    for (const c of [bg, fx]) {
      c.width = Math.round(W * dpr); c.height = Math.round(H * dpr);
      c.getContext("2d").setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    bgGrad = bctx.createRadialGradient(W / 2, H * 0.45, 0, W / 2, H * 0.45, Math.max(W, H) * 0.75);
    bgGrad.addColorStop(0, "#12063a");
    bgGrad.addColorStop(1, "#050014");
    bgGradHyper = bctx.createRadialGradient(W / 2, H * 0.45, 0, W / 2, H * 0.45, Math.max(W, H) * 0.75);
    bgGradHyper.addColorStop(0, "#2a0a5e");
    bgGradHyper.addColorStop(1, "#050014");
  }
  addEventListener("resize", resize);

  /* ---- glow sprites (replaces per-particle shadowBlur) ---- */
  const spriteCache = new Map();
  function sprite(color) {
    let s = spriteCache.get(color);
    if (s) return s;
    s = document.createElement("canvas");
    s.width = s.height = 32;
    const g = s.getContext("2d");
    const rg = g.createRadialGradient(16, 16, 0, 16, 16, 16);
    rg.addColorStop(0, "#ffffff");
    rg.addColorStop(0.22, color);
    rg.addColorStop(1, "rgba(0,0,0,0)");
    g.fillStyle = rg;
    g.fillRect(0, 0, 32, 32);
    spriteCache.set(color, s);
    return s;
  }

  /* ---- pooled DOM effects ---- */
  const fxdom = document.getElementById("fxdom");
  const domPool = { pop: [], ring: [], ringin: [], rays: [] };
  function domFx(cls, x, y, color, size) {
    if (reduced) return;
    let el = domPool[cls].pop();
    if (!el) {
      el = document.createElement("div");
      el.className = cls;
      el.dataset.cls = cls;
      el.addEventListener("animationend", () => {
        el.classList.remove("go");
        domPool[el.dataset.cls].push(el);
      });
      fxdom.appendChild(el);
    }
    el.style.setProperty("--c", color);
    el.style.width = el.style.height = size + "px";
    el.style.left = (x - size / 2) + "px";
    el.style.top = (y - size / 2) + "px";
    // restart the animation even if the element was mid-flight
    el.classList.remove("go");
    void el.offsetWidth;
    el.classList.add("go");
  }

  /* ---- background: grid + orbs + hyperdrive ---- */
  const orbs = Array.from({ length: 30 }, () => ({
    x: Math.random() * 2000, y: Math.random() * 2000,
    r: 1 + Math.random() * 2.6,
    vx: (Math.random() - 0.5) * 0.35, vy: (Math.random() - 0.5) * 0.35,
    c: ["#ff2e97", "#00f0ff", "#ffd34d", "#7c4dff"][Math.floor(Math.random() * 4)]
  }));
  let gridT = 0, hyper = 0;
  function drawBG() {
    bctx.fillStyle = bgGrad;
    bctx.fillRect(0, 0, W, H);
    if (hyper > 0.01) {
      bctx.globalAlpha = hyper;
      bctx.fillStyle = bgGradHyper;
      bctx.fillRect(0, 0, W, H);
      bctx.globalAlpha = 1;
      hyper *= 0.965;
    } else hyper = 0;

    const horizon = H * 0.62;
    if (!reduced) gridT = (gridT + 0.006 + hyper * 0.09) % 1;
    const GH = M().gridH, GV = M().gridV;
    bctx.lineWidth = 1;
    for (let i = 0; i < GH; i++) {
      const p = ((i / GH + gridT) % 1);
      const y = horizon + Math.pow(p, 2.6) * (H - horizon);
      bctx.strokeStyle = `rgba(255,46,151,${0.05 + p * (0.28 + hyper * 0.5)})`;
      bctx.beginPath(); bctx.moveTo(0, y); bctx.lineTo(W, y); bctx.stroke();
    }
    bctx.strokeStyle = `rgba(0,240,255,${0.10 + hyper * 0.25})`;
    bctx.beginPath();
    for (let i = -GV; i <= GV; i++) {
      bctx.moveTo(W / 2 + i * 40, horizon);
      bctx.lineTo(W / 2 + i * W * 0.16, H);
    }
    bctx.stroke();

    bctx.globalCompositeOperation = "lighter";
    const NO = M().orbs;
    for (let oi = 0; oi < NO; oi++) {
      const o = orbs[oi];
      if (!reduced) {
        if (hyper > 0.05) {
          const dx = o.x - W / 2, dy = o.y - H / 2;
          const dist = Math.hypot(dx, dy) || 1;
          o.x += (dx / dist) * hyper * 26;
          o.y += (dy / dist) * hyper * 26;
          if (o.x < -30 || o.x > W + 30 || o.y < -30 || o.y > H + 30) {
            o.x = W / 2 + (Math.random() - 0.5) * 200;
            o.y = H / 2 + (Math.random() - 0.5) * 200;
          }
        } else {
          o.x += o.vx; o.y += o.vy;
          if (o.x < -20) o.x = W + 20; if (o.x > W + 20) o.x = -20;
          if (o.y < -20) o.y = H + 20; if (o.y > H + 20) o.y = -20;
        }
      }
      const ox = o.x % W, oy = o.y % H;
      if (hyper > 0.05) {
        const dx = ox - W / 2, dy = oy - H / 2;
        const dist = Math.hypot(dx, dy) || 1;
        bctx.strokeStyle = o.c;
        bctx.globalAlpha = 0.8;
        bctx.lineWidth = o.r;
        bctx.beginPath();
        bctx.moveTo(ox, oy);
        bctx.lineTo(ox - (dx / dist) * hyper * 60, oy - (dy / dist) * hyper * 60);
        bctx.stroke();
        bctx.globalAlpha = 1;
      } else {
        const sz = o.r * 7;
        bctx.drawImage(sprite(o.c), ox - sz / 2, oy - sz / 2, sz, sz);
      }
    }
    bctx.globalCompositeOperation = "source-over";
  }

  /* ---- fx: particles, waves, texts, lightning ---- */
  const parts = [], waves = [], texts = [], bolts = [];
  const COLORS = ["#ff2e97", "#00f0ff", "#ffd34d", "#7c4dff", "#39ff88", "#ffffff"];
  function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
  function spawn(p) {
    if (parts.length >= M().cap) return false;
    parts.push(p);
    return true;
  }
  function burst(x, y, n, power = 5, colors = COLORS, trail = false) {
    if (M().css) {
      // LITE: one pooled DOM pop instead of a particle shower
      domFx("pop", x, y, pick(colors), 90 + power * 12);
      if (power >= 5) domFx("ring", x, y, pick(colors), 120 + power * 14);
      return;
    }
    n = reduced ? Math.min(q(n), 8) : q(n);
    trail = trail && M().trails;
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, s = (0.3 + Math.random()) * power;
      if (!spawn({
        x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - power * 0.3,
        life: 1, decay: 0.014 + Math.random() * 0.022,
        r: 1.5 + Math.random() * 3,
        c: pick(colors),
        grav: 0.08, trail,
        crackle: trail && Math.random() < 0.2
      })) break;
    }
  }
  function implode(x, y, n) {
    if (reduced) return;
    if (M().css) {
      domFx("ringin", x, y, "#ffd34d", 320);
      domFx("ringin", x, y, "#00f0ff", 460);
      return;
    }
    n = q(n);
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2;
      const dist = 140 + Math.random() * 220;
      const px = x + Math.cos(a) * dist, py = y + Math.sin(a) * dist;
      const frames = 26 + Math.random() * 14;
      if (!spawn({
        x: px, y: py,
        vx: (x - px) / frames, vy: (y - py) / frames,
        life: 1, decay: 1 / frames,
        r: 1.5 + Math.random() * 2.5,
        c: pick(COLORS),
        grav: 0, trail: M().trails
      })) break;
    }
  }
  function wave(x, y, color = "#00f0ff", max = 160, width = 3) {
    waves.push({ x, y, r: 6, max, life: 1, color, width });
  }
  function floatText(msg, x, y, color = "#ffd34d", size = 26) {
    texts.push({ msg, x, y, vy: -1.4, life: 1, color, size });
  }
  function lightning(x1, y1, x2, y2, color = "#aef4ff") {
    if (reduced) return;
    const pts = [[x1, y1]];
    const n = 12;
    for (let i = 1; i < n; i++) {
      const t = i / n;
      pts.push([
        x1 + (x2 - x1) * t + (Math.random() - 0.5) * 70,
        y1 + (y2 - y1) * t + (Math.random() - 0.5) * 70
      ]);
    }
    pts.push([x2, y2]);
    bolts.push({ pts, life: 1, color, w: 2 + Math.random() * 2.5 });
    if (mode === 0 && Math.random() < 0.7) {
      const bi = 3 + Math.floor(Math.random() * (n - 6));
      const [bx, by] = pts[bi];
      const bpts = [[bx, by]];
      for (let j = 1; j <= 5; j++) {
        bpts.push([bx + (Math.random() - 0.5) * 120, by + j * 26 + (Math.random() - 0.5) * 40]);
      }
      bolts.push({ pts: bpts, life: 0.8, color, w: 1.4 });
    }
  }
  function firework(x, y) {
    const hue = Math.floor(Math.random() * 360);
    const c1 = `hsl(${hue},100%,65%)`, c2 = `hsl(${(hue + 40) % 360},100%,70%)`;
    if (M().css) {
      // LITE firework: glow pop + expanding rays + ring, zero particles
      domFx("pop", x, y, c1, 200);
      domFx("rays", x, y, c2, 280);
      domFx("ring", x, y, c1, 260);
      return;
    }
    burst(x, y, 55, 7.5, [c1, c2, "#ffffff"], true);
    wave(x, y, c1, 240);
    if (mode === 0) domFx("rays", x, y, c2, 300);
  }
  function drawFX() {
    fctx.clearRect(0, 0, W, H);
    if (!parts.length && !waves.length && !texts.length && !bolts.length) return;
    fctx.globalCompositeOperation = "lighter";
    for (let i = parts.length - 1; i >= 0; i--) {
      const p = parts[i];
      p.x += p.vx; p.y += p.vy; p.vy += p.grav;
      p.life -= p.decay;
      if (p.life <= 0) { parts.splice(i, 1); continue; }
      if (p.crackle && p.life < 0.45 && Math.random() < 0.08) {
        p.crackle = false;
        for (let j = 0; j < 3; j++) {
          const a = Math.random() * Math.PI * 2;
          if (!spawn({
            x: p.x, y: p.y,
            vx: Math.cos(a) * 2, vy: Math.sin(a) * 2,
            life: 0.5, decay: 0.05, r: 1, c: "#ffffff",
            grav: 0.05, trail: false
          })) break;
        }
      }
      fctx.globalAlpha = p.life;
      if (p.trail) {
        fctx.strokeStyle = p.c;
        fctx.lineWidth = Math.max(p.r * p.life, 0.5);
        fctx.beginPath();
        fctx.moveTo(p.x - p.vx * 3, p.y - p.vy * 3);
        fctx.lineTo(p.x, p.y);
        fctx.stroke();
      }

      fctx.drawImage(sprite(p.c), p.x - sz / 2, p.y - sz / 2, sz, sz);
    }
    for (let i = waves.length - 1; i >= 0; i--) {
      const w = waves[i];
      w.r += (w.max - w.r) * 0.14; w.life -= 0.04;

      fctx.strokeStyle = w.color; fctx.lineWidth = w.width * w.life + 1;
      fctx.beginPath(); fctx.arc(w.x, w.y, w.r, 0, 7); fctx.stroke();
    }

      const b = bolts[i];
      b.life -= 0.07;
      if (b.life <= 0) { bolts.splice(i, 1); continue; }
      fctx.beginPath();
      fctx.moveTo(b.pts[0][0], b.pts[0][1]);
      for (let j = 1; j < b.pts.length; j++) fctx.lineTo(b.pts[j][0], b.pts[j][1]);
      fctx.globalAlpha = b.life * 0.35;
      fctx.strokeStyle = b.color;
      fctx.lineWidth = (b.w * b.life + 0.5) * 3.5;
      fctx.stroke();
      fctx.globalAlpha = b.life;
      fctx.strokeStyle = "#ffffff";
      fctx.lineWidth = b.w * b.life + 0.5;
      fctx.stroke();
    }
    fctx.globalCompositeOperation = "source-over";
    for (let i = texts.length - 1; i >= 0; i--) {
      const t = texts[i];
      t.y += t.vy; t.life -= 0.02;
      if (t.life <= 0) { texts.splice(i, 1); continue; }
      fctx.globalAlpha = Math.min(1, t.life * 1.6);
      fctx.font = `900 ${t.size}px "Arial Black", sans-serif`;
      fctx.textAlign = "center";
      fctx.fillStyle = "rgba(0,0,0,0.55)";
      fctx.fillText(t.msg, t.x + 3, t.y + 3);
      fctx.fillStyle = t.color;
      fctx.fillText(t.msg, t.x, t.y);
      fctx.globalAlpha = Math.min(1, t.life) * 0.45;
      fctx.fillText(t.msg, t.x, t.y + 1);
    }
    fctx.globalAlpha = 1;
  }

  /* ---- main loop with frame-time governor (AUTO mode only) ---- */
  let lastT = 0, ema = 16.7, frames = 0, lastShift = 0;
  function loop(t) {
    const dt = t - lastT; lastT = t;
    if (dt > 0 && dt < 250) ema = ema * 0.94 + dt * 0.06;
    frames++;
    if (autoMode && frames % 45 === 0) {
      if (ema > 25 && mode < 2 && t - lastShift > 1500) { applyMode(mode + 1); lastShift = t; }
      else if (ema < 12 && mode > 0 && t - lastShift > 8000) { applyMode(mode - 1); lastShift = t; }
    }
    drawBG();
    drawFX();
    requestAnimationFrame(loop);
  }

  /* ================= screen shake / flash ================= */
  const stage = document.getElementById("stage");
  let shakeAmt = 0, shaking = false;
  function shake(amt) {
    if (reduced) return;
    shakeAmt = Math.max(shakeAmt, amt);
    if (shaking) return;
    shaking = true;
    (function step() {
      if (shakeAmt <= 0.4) { stage.style.transform = ""; shaking = false; return; }
      shakeAmt *= 0.88;
      stage.style.transform =
        `translate(${(Math.random() - 0.5) * shakeAmt * 2}px, ${(Math.random() - 0.5) * shakeAmt * 2}px)`;
      requestAnimationFrame(step);
    })();
  }
  const flashEl = document.getElementById("flash");
  function flash(op = 0.5, dur = 0.4) {
    if (reduced) return;
    flashEl.style.transition = "none";
    flashEl.style.opacity = op;
    requestAnimationFrame(() => {
      flashEl.style.transition = `opacity ${dur}s`;
      flashEl.style.opacity = 0;
    });
  }

  /* ================= combo ================= */
  const comboEl = document.getElementById("combo");
  let combo = 0, comboTimer = null;
  const HYPE = ["GOOD!", "GREAT!!", "EXCELLENT!!", "AMAZING!!!", "無駄にド派手!!!", "GODLIKE!!!!"];
  function hitCombo(x, y) {
    combo++;
    clearTimeout(comboTimer);
    comboTimer = setTimeout(() => { combo = 0; comboEl.classList.remove("on", "mega"); }, 2200);
    if (combo >= 3) {
      comboEl.textContent = `${combo} COMBO!!`;
      comboEl.classList.add("on");
      comboEl.classList.toggle("mega", combo >= 10);
      if (combo % 5 === 0) {
        const msg = HYPE[Math.min(Math.floor(combo / 5) - 1, HYPE.length - 1)];
        floatText(msg, x, y - 60, "#ffd34d", 30);
        beep(660 + combo * 20, 0.12, "triangle", 0.1);
      }
    }
  }

  /* ================= calculator core ================= */
  const outEl = document.getElementById("out");
  const exprEl = document.getElementById("expr");
  const cabEl = document.getElementById("cab");
  const dimEl = document.getElementById("dim");
  const boomEl = document.getElementById("boom");
  const boomNum = boomEl.querySelector(".num");
  const cutinEl = document.getElementById("cutin");
  const cutinText = cutinEl.querySelector("span");
  const OPCHAR = { "+": "+", "-": "−", "*": "×", "/": "÷" };
  let acc = null, op = null, entry = "0", fresh = true, errored = false, busy = false;
  /* last executed operation, so "=" alone repeats it (1+2=3, "=" → +2 → 5) */
  let lastOp = null, lastB = null;

  function fmt(n) {
    if (!isFinite(n)) return "ERROR";
    if (Math.abs(n) >= 1e12 || (Math.abs(n) < 1e-9 && n !== 0)) {
      return n.toExponential(6).replace(/(\.\d*?)0+e/, "$1e").replace(/\.e/, "e");
    }
    let s = String(Math.round(n * 1e10) / 1e10);
    if (s.replace("-", "").replace(".", "").length > 12) s = n.toPrecision(12);
    return s.includes(".") ? s.replace(/0+$/, "").replace(/\.$/, "") : s;
  }
  function apply(a, o, b) {
    switch (o) {
      case "+": return a + b;
      case "-": return a - b;
      case "*": return a * b;
      case "/": return b === 0 ? Infinity : a / b;
    }
  }
  function show() {
    outEl.textContent = entry;
    exprEl.textContent = op !== null ? `${fmt(acc)} ${OPCHAR[op]}` : "";
    const len = entry.length;
    outEl.style.fontSize = len > 10 ? `clamp(20px, ${Math.max(4, 90 / len)}vw, 36px)` : "";
  }
  function clearErr() {
    if (!errored) return;
    errored = false;
    outEl.classList.remove("err");
    document.body.classList.remove("alarm");
  }
  function reset() {
    acc = null; op = null; entry = "0"; fresh = true;
    lastOp = null; lastB = null;
    clearErr(); show();
  }
  function displayCenter() {
    const r = document.getElementById("display").getBoundingClientRect();
    return { x: r.left + r.width / 2, y: r.top + r.height / 2 };
  }

  function press(k, x, y) {
    if (busy) return;
    if (errored && k !== "C") { reset(); }
    switch (true) {
      case /^[0-9]$/.test(k): {
        if (fresh) { entry = k; fresh = false; }
        else if (entry.replace(/[-.]/g, "").length < 12) {
          entry = entry === "0" ? k : entry + k;
        }
        beep(420 + Number(k) * 45, 0.06);
        burst(x, y, 12, 4, COLORS, true);
        shake(3);
        break;
      }
      case k === ".": {
        if (fresh) { entry = "0."; fresh = false; }
        else if (!entry.includes(".")) entry += ".";
        beep(300, 0.06);
        burst(x, y, 8, 3);
        break;
      }
      case k in OPCHAR: {
        if (op !== null && !fresh) {
          const r = apply(acc, op, parseFloat(entry));
          if (!isFinite(r)) return explodeError(x, y);
          acc = r;
        } else if (acc === null || !fresh) {
          acc = parseFloat(entry);
        }
        op = k; fresh = true; entry = fmt(acc);
        beep(220, 0.09, "sawtooth", 0.1);
        zapSnd();
        burst(x, y, 18, 5, ["#00f0ff", "#7c4dff", "#ffffff"], true);
        wave(x, y, "#00f0ff", 120);
        const dc = displayCenter();
        if (M().bolts > 1) lightning(x, y, dc.x, dc.y, "#8ef2ff");
        else domFx("ring", x, y, "#00f0ff", 140);
        shake(6);
        break;
      }
      case k === "=": {
        let o, base, b;
        if (op !== null) {
          o = op; base = acc;
          b = fresh ? acc : parseFloat(entry);
        } else if (lastOp !== null) {
          // bare "=" repeats the last operation on the current value
          o = lastOp; base = parseFloat(entry); b = lastB;
        } else {
          const dc = displayCenter();
          wave(dc.x, dc.y, "#ff2e97", 160);
          burst(x, y, 20, 6);
          flash(0.2);
          shake(7);
          beep(700, 0.15, "triangle", 0.1);
          break;
        }
        const r = apply(base, o, b);
        if (!isFinite(r)) return explodeError(x, y);
        const isRepeat = op === null;
        lastOp = o; lastB = b;
        acc = null; op = null; fresh = true;
        hitCombo(x, y);
        equalExplosion(fmt(r), x, y, isRepeat);
        return;
      }
      case k === "C": {
        reset();
        beep(160, 0.12, "sawtooth", 0.1);
        wave(x, y, "#ffd34d", 130);
        burst(x, y, 14, 4, ["#ffd34d", "#ffffff"]);
        shake(4);
        break;
      }
      case k === "bs": {
        if (!fresh) {
          entry = entry.length > 1 ? entry.slice(0, -1) : "0";
          if (entry === "-") entry = "0";
        }
        beep(240, 0.05);
        burst(x, y, 6, 2.5);
        break;
      }
      case k === "%": {
        entry = fmt(parseFloat(entry) / 100);
        fresh = false;
        beep(520, 0.08, "triangle");
        wave(x, y, "#ffd34d", 90);
        break;
      }
    }
    hitCombo(x, y);
    show();
  }

  /* ============ THE ULTIMATE RESULT EXPLOSION ============ */
  function equalExplosion(resStr, x, y, isRepeat = false) {
    if (reduced) {
      entry = resStr; show();
      outEl.classList.remove("slam"); void outEl.offsetWidth;
      outEl.classList.add("slam");
      chord();
      return;
    }
    busy = true;
    const dc = displayCenter();

    /* --- phase 1: charge (0 – 560ms) --- */
    exprEl.textContent = isRepeat
      ? `⚡ REPEAT ${OPCHAR[lastOp]} ${fmt(lastB)} ⚡`
      : "⚡ ENERGY CHARGING ⚡";
    exprEl.classList.add("charge");
    cabEl.classList.add("charging");
    dimEl.classList.add("on");
    riserSnd();
    implode(dc.x, dc.y, 50);
    setTimeout(() => implode(dc.x, dc.y, 36), 220);
    wave(x, y, "#ffd34d", 60, 2);

    /* --- phase 2: detonation (560ms) --- */
    setTimeout(() => {
      entry = resStr;
      show();
      exprEl.classList.remove("charge");
      cabEl.classList.remove("charging");

      boomSnd();
      chord(0.25);
      flash(0.95, 0.55);
      shake(46);
      hyper = 1;

      // shockwaves: canvas rings + a pooled DOM pop for the core glow
      domFx("pop", dc.x, dc.y, "#ffffff", 340);
      wave(dc.x, dc.y, "#ffffff", 340, 6);
      setTimeout(() => wave(dc.x, dc.y, "#ff2e97", 420, 5), 90);
      setTimeout(() => wave(dc.x, dc.y, "#00f0ff", 520, 4), 180);
      if (mode === 0) {
        setTimeout(() => wave(dc.x, dc.y, "#ffd34d", 640, 3), 280);
        setTimeout(() => wave(dc.x, dc.y, "#7c4dff", 760, 3), 380);
      }
      if (M().css) {
        domFx("ring", dc.x, dc.y, "#ff2e97", 500);
        setTimeout(() => domFx("ring", dc.x, dc.y, "#00f0ff", 700), 120);
        domFx("rays", dc.x, dc.y, "#ffd34d", 560);
      }

      // debris blast
      burst(dc.x, dc.y, 130, 12, COLORS, true);
      setTimeout(() => burst(dc.x, dc.y, 65, 8, ["#ffd34d", "#ff9e2e", "#ffffff"], true), 140);

      // lightning storm onto the display
      const NB = M().bolts;
      for (let i = 0; i < NB; i++) {
        setTimeout(() => {
          lightning(Math.random() * W, -20, dc.x + (Math.random() - 0.5) * 120, dc.y, "#aef4ff");
          zapSnd();
        }, i * 80);
      }

      // giant exploding result across the screen
      boomNum.innerHTML = "";
      [...resStr].forEach((ch, i) => {
        const s = document.createElement("span");
        s.className = "ch";
        s.textContent = ch;
        s.style.animationDelay = `${i * 45}ms`;
        s.style.setProperty("--rot", `${(Math.random() - 0.5) * 60}deg`);
        boomNum.appendChild(s);
      });
      boomEl.classList.remove("fly");
      boomEl.classList.add("show");

      // cut-in banner
      cutinText.textContent = isRepeat ? "ONE MORE!!!" : "ANSWER!!!";
      cutinEl.classList.remove("go", "red");
      void cutinEl.offsetWidth;
      cutinEl.classList.add("go");

      // fireworks barrage
      const NF = M().fw;
      for (let i = 0; i < NF; i++) {
        setTimeout(() => firework(
          Math.random() * W * 0.9 + W * 0.05,
          Math.random() * H * 0.55 + H * 0.08
        ), 150 + i * (mode === 0 ? 110 : 160));
      }
      floatText("CALCULATED!!", W / 2, H * 0.2, "#ff2e97", 36);

      /* --- phase 3: result flies into the display (≈1150ms later) --- */
      setTimeout(() => {
        const br = boomNum.getBoundingClientRect();
        const bcx = br.left + br.width / 2, bcy = br.top + br.height / 2;
        boomNum.style.setProperty("--tx", `${dc.x - bcx}px`);
        boomNum.style.setProperty("--ty", `${dc.y - bcy}px`);
        boomEl.classList.add("fly");
        dimEl.classList.remove("on");
        setTimeout(() => {
          boomEl.classList.remove("show", "fly");
          outEl.classList.remove("slam"); void outEl.offsetWidth;
          outEl.classList.add("slam");
          domFx("pop", dc.x, dc.y, "#00f0ff", 220);
          wave(dc.x, dc.y, "#ffffff", 200, 4);
          burst(dc.x, dc.y, 40, 6, COLORS, true);
          flash(0.3);
          shake(14);
          beep(1046.5, 0.2, "triangle", 0.12);
          busy = false;
        }, 400);
      }, 1150);
    }, 560);
  }

  /* ============ division-by-zero catastrophe ============ */
  function explodeError(x, y) {
    entry = "ERROR"; acc = null; op = null; fresh = true; errored = true;
    outEl.textContent = "ERROR";
    exprEl.textContent = "0で割るな!!";
    outEl.classList.add("err");
    document.body.classList.add("alarm");
    alarmSnd();
    boomSnd();
    flash(0.8, 0.6);
    shake(34);
    hyper = 0.7;
    domFx("pop", x, y, "#ff2e4d", 300);
    burst(x, y, 80, 10, ["#ff2e4d", "#ff5c00", "#ffd34d", "#ffffff"], true);
    wave(x, y, "#ff2e4d", 380, 5);
    setTimeout(() => wave(x, y, "#ff5c00", 480, 4), 120);
    const NB = M().bolts;
    for (let i = 0; i < NB; i++) {
      setTimeout(() => {
        lightning(Math.random() * W, -20, Math.random() * W, H * (0.3 + Math.random() * 0.5), "#ff4d6a");
        zapSnd();
      }, i * 100);
    }
    cutinText.textContent = "ゼロ除算!!!";
    cutinEl.classList.remove("go");
    cutinEl.classList.add("red");
    void cutinEl.offsetWidth;
    cutinEl.classList.add("go");
    floatText("DIVISION BY ZERO", W / 2, H * 0.24, "#ff5c7a", 30);
    setTimeout(() => { document.body.classList.remove("alarm"); }, 1800);
  }

  /* ================= input ================= */
  document.getElementById("keys").addEventListener("click", (e) => {
    const btn = e.target.closest("button.key");
    if (!btn) return;
    const r = btn.getBoundingClientRect();
    press(btn.dataset.k, r.left + r.width / 2, r.top + r.height / 2);
  });

  const KEYMAP = {
    Enter: "=", "=": "=", Escape: "C", c: "C", C: "C", Backspace: "bs",
    "%": "%", ".": ".", "+": "+", "-": "-", "*": "*", "/": "/",
  };
  for (let i = 0; i <= 9; i++) KEYMAP[String(i)] = String(i);
  addEventListener("keydown", (e) => {
    const k = KEYMAP[e.key];
    if (k === undefined) return;
    e.preventDefault();
    const btn = document.querySelector(`button.key[data-k="${k}"]`);
    let x = W / 2, y = H / 2;
    if (btn) {
      const r = btn.getBoundingClientRect();
      x = r.left + r.width / 2; y = r.top + r.height / 2;
      btn.classList.add("pressed");
      setTimeout(() => btn.classList.remove("pressed"), 90);
    }
    press(k, x, y);
  });

  /* ================= boot ================= */
  const saved = load("fxmode");
  if (saved === "0" || saved === "1" || saved === "2") {
    autoMode = false;
    applyMode(Number(saved));
  } else {
    autoMode = true;
    applyMode(detectMode());
  }
  requestAnimationFrame(loop);
  show();
  if (!reduced) {
    setTimeout(() => firework(W / 2, H * 0.28), 450);
    setTimeout(() => firework(W * 0.25, H * 0.35), 800);
    setTimeout(() => firework(W * 0.75, H * 0.35), 1150);
  }
})();
</script>

</body>
</html>
